<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de Sesión - Sistema de Gestión de Servicio Técnico UNINORTE">
    <title>Iniciar Sesión - UNINORTE Servicio Técnico</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- LOGO Y TÍTULO -->
            <div class="text-center">
                <div class="auth-brand">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">Servicio Técnico</h3>
                <p class="text-secondary small mb-4">Gestión y Trazabilidad por Códigos QR &bull; UNINORTE</p>
            </div>

            <!-- MENSAJES FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show small d-flex align-items-center gap-2 border-0 rounded-3 mb-3 py-2" role="alert">
                            <i class="bi bi-info-circle-fill"></i>
                            <div class="flex-grow-1">{{ message }}</div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Usuario o Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-secondary">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="Ej: admin o admin@uninorte.edu.py" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-secondary">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        <button class="btn btn-light border border-start-0 text-secondary" type="button" id="togglePasswordBtn">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label small text-secondary" for="remember">
                            Recordar mi sesión
                        </label>
                    </div>
                    <span class="badge bg-light text-primary border small">v1.0 Producción</span>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
                    <i class="bi bi-box-arrow-in-right fs-5"></i>
                    <span>Ingresar al Sistema</span>
                </button>
            </form>

            <!-- ACCESOS RÁPIDOS DE PRUEBA (PARA DEFENSA ACADÉMICA) -->
            <div class="border-top pt-3 text-center">
                <small class="text-muted d-block mb-2 fw-semibold">Acceso Rápido para Demostración:</small>
                <div class="d-flex gap-2 justify-content-center">
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="fillCredentials('admin', 'admin123')">
                        <i class="bi bi-shield-lock-fill me-1"></i> Admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="fillCredentials('tecnico', 'tecnico123')">
                        <i class="bi bi-wrench-adjustable me-1"></i> Técnico
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Ver / Ocultar Contraseña
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleIcon.classList.toggle('bi-eye', !isPassword);
                toggleIcon.classList.toggle('bi-eye-slash', isPassword);
            });
        }

        // Auto-completado de credenciales para demostración
        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
